[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DreamLogics/crol"
homepage = "https://github.com/DreamLogics/crol"

[workspace.dependencies]
# Workspace crates. All crates share one version number (SPEC.md 14.4).
crol = { path = "crates/crol", version = "0.1.0" }
crol-derive = { path = "crates/crol-derive", version = "0.1.0" }
crol-eval = { path = "crates/crol-eval", version = "0.1.0" }
crol-lsp = { path = "crates/crol-lsp", version = "0.1.0" }
crol-syntax = { path = "crates/crol-syntax", version = "0.1.0" }

# External dependencies are kept small (SPEC.md 14.1).
rowan = "0.17"
indexmap = "2.14"
blake3 = "1.8"
serde = "1.0.228"

# crol-derive only.
proc-macro2 = "1.0.106"
quote = "1.0.40"
syn = { version = "2.0.100", features = ["full"] }

# crol-cli only.
clap = { version = "4.6", features = ["derive"] }
codespan-reporting = "0.13"

# Development only.
expect-test = "1.5"
serde_derive = "1.0.228"
proptest = "1.12"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
