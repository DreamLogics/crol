# CROL for Helix: add this to your own languages.toml.

[[language]]
name = "crol"
scope = "source.crol"
injection-regex = "^crol$"
file-types = ["crod", "crol"]
roots = ["project.crol"]
comment-tokens = ["//", "///"]
block-comment-tokens = { start = "/*", end = "*/" }
indent = { tab-width = 4, unit = "    " }
auto-pairs = { "(" = ")", "{" = "}", "[" = "]", '"' = '"', "'" = "'" }
language-servers = ["crol"]

[language-server.crol]
command = "crol"
args = ["lsp"]

[[grammar]]
name = "crol"
source = { git = "https://github.com/DreamLogics/crol", rev = "69373390c9588cfad941753238dad90bd037c66b", subpath = "tree-sitter-crol" }
