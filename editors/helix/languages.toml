# CROL for Helix: add this to your own languages.toml.

[[language]]
name = "crol"
scope = "source.crol"
injection-regex = "^crol$"
file-types = ["crod", "crol"]
roots = ["project.crol"]
comment-tokens = ["//", "///"]
block-comment-tokens = { start = "/*", end = "*/" }
indent = { tab-width = 4, unit = "    " }
auto-pairs = { "(" = ")", "{" = "}", "[" = "]", '"' = '"', "'" = "'" }
language-servers = ["crol"]

[language-server.crol]
command = "crol"
args = ["lsp"]

[[grammar]]
name = "crol"
source = { git = "https://github.com/DreamLogics/crol", rev = "d677c69d7a35b8ee3db8c2b165ba6f34ca02c3ff", subpath = "tree-sitter-crol" }
