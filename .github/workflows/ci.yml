name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Each way of fetching schemas on its own, and neither.
      - run: cargo clippy -p crol --all-targets --features remote-schemas -- -D warnings
      - run: cargo clippy -p crol --all-targets --features remote-schemas-async -- -D warnings
      - run: cargo clippy -p crol-lsp -p crol-cli --all-targets --no-default-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # x86-64 and AArch64 on every platform, for determinism (SPEC.md 14.2).
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain is an input, not the action's ref, so that Dependabot
      # does not take it for the action's version.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  wasm:
    name: wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p crol-syntax -p crol-eval -p crol --target wasm32-unknown-unknown

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Checks that every publishable crate packages and builds on its own.
      - run: cargo package --workspace

  grammar:
    name: Tree-sitter grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The pins name commits, which check-pins.sh looks up.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: tree-sitter-cli@0.25.10
      - name: The generated parser is up to date
        working-directory: tree-sitter-crol
        run: |
          tree-sitter generate
          git diff --exit-code src/
      - name: Corpus tests
        working-directory: tree-sitter-crol
        run: tree-sitter test
      - name: The grammar and the Rust parser agree (SPEC.md 12.6)
        working-directory: tree-sitter-crol
        run: ./check-corpus.sh
      - name: The editors pin the current grammar
        run: tree-sitter-crol/check-pins.sh
      - name: The Zed extension's queries are the grammar's
        run: |
          for query in highlights brackets indents outline textobjects; do
            diff -u "tree-sitter-crol/queries/$query.scm" "editors/zed/languages/crol/$query.scm"
          done

      - name: The Helix queries compile against the grammar
        working-directory: tree-sitter-crol
        run: |
          for query in ../editors/helix/queries/crol/*.scm; do
            tree-sitter query --quiet "$query" test/corpus/crol.txt
          done

  zed:
    name: Zed extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editors/zed
      - run: cargo build --manifest-path editors/zed/Cargo.toml --target wasm32-wasip2

  fuzz:
    name: Fuzzing (a minute per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Run each target, seeded with the test files
        run: |
          for target in parse evaluate_value evaluate_data compiled_layer; do
            mkdir -p "fuzz/corpus/$target"
            cargo fuzz run --target x86_64-unknown-linux-gnu "$target" \
              "fuzz/corpus/$target" tests/syntax/valid tests/cases \
              -- -max_total_time=60 -timeout=10 -rss_limit_mb=2048 -max_len=4096
          done
      - name: Keep what crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
