name: Release

# A tag `vX.Y.Z` publishes the crates to crates.io and makes a GitHub release
# with the `crol` binary for each platform (SPEC.md 14.4).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  # A change to this file builds every target, and publishes nothing.
  pull_request:
    paths: [.github/workflows/release.yml]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the workspace version and the changelog
        if: github.event_name == 'push'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || 'dry-run' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked -p crol-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="crol-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/crol.exe" "$name/"
            7z a "$name.zip" "$name"
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/crol" "$name/"
            tar -czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # A crate's first version goes up by hand (CONTRIBUTING.md), and a run
      # that stopped part of the way can run again.
      - name: Find the crates that are not on crates.io yet
        id: pending
        run: |
          version="${GITHUB_REF_NAME#v}"
          packages=""
          crates=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.publish != []) | .name')
          for crate in $crates; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A 'crol release workflow (https://github.com/DreamLogics/crol)' \
              "https://crates.io/api/v1/crates/$crate/$version")
            case "$status" in
              200) echo "$crate $version is on crates.io" ;;
              404) packages="$packages -p $crate" ;;
              *) echo "crates.io answered $status for $crate" >&2; exit 1 ;;
            esac
          done
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.pending.outputs.packages != ''
        id: auth
      # In dependency order.
      - if: steps.pending.outputs.packages != ''
        run: cargo publish --locked ${{ steps.pending.outputs.packages }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: GitHub release
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          for file in *; do sha256sum "$file" > "$file.sha256"; done
          sha256sum crol-* | grep -v '\.sha256' > SHA256SUMS
      - name: The notes, from the changelog
        run: |
          heading="## [${GITHUB_REF_NAME#v}]"
          awk -v heading="$heading" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
