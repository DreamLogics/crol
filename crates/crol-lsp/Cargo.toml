[package]
name = "crol-lsp"
description = "Language server for CROL, the Composable Rust Object Language"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["crol", "lsp", "language-server"]
categories = ["development-tools", "text-editors"]
readme = "README.md"

[features]
default = ["remote-schemas"]
# Schemas from URLs and crates (`SPEC.md` 4.1).
remote-schemas = ["crol/remote-schemas"]

[dependencies]
crol.workspace = true
crol-eval.workspace = true
crol-syntax.workspace = true
crossbeam-channel.workspace = true
indexmap.workspace = true
lsp-server.workspace = true
lsp-types.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
