[package]
name = "crol"
description = "CROL, the Composable Rust Object Language: layered, composable configuration and data files for serde"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["crol", "configuration", "config", "serde", "ron"]
categories = ["config", "encoding", "parser-implementations"]
readme = "README.md"

[features]
# `#[derive(Schema)]` and `#[derive(VariantName)]`.
derive = ["dep:crol-derive"]
# Schemas from URLs and crates (`SPEC.md` 4.1), for tools, fetched with a
# blocking client.
remote-schemas = ["_remote", "dep:ureq"]
# The same, fetched without blocking: `schema::resolve_remote_async`, which
# needs a Tokio runtime. `schema::resolve_remote` then starts one of its own.
remote-schemas-async = ["_remote", "dep:reqwest", "dep:rustls", "dep:tokio"]
# What both share; with it alone, only cached copies and local crates.
_remote = [
    "dep:blake3",
    "dep:flate2",
    "dep:semver",
    "dep:serde_json",
    "dep:tar",
    "dep:toml",
]

[dependencies]
blake3 = { workspace = true, optional = true }
crol-derive = { workspace = true, optional = true }
crol-eval.workspace = true
crol-syntax.workspace = true
flate2 = { workspace = true, optional = true }
indexmap = { workspace = true, features = ["serde"] }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

[dev-dependencies]
crol-derive.workspace = true
expect-test.workspace = true
proptest.workspace = true
serde_derive.workspace = true
tokio.workspace = true

[lints]
workspace = true
